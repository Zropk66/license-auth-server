services:
  app:
    image: ghcr.io/zropk66/license-auth-server:latest
    # 需要本地改代码构建时改用: docker compose up -d --build
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # 覆盖 DATABASE_URL，指向 Docker 内部 db 服务
      - DATABASE_URL=postgresql://${POSTGRES_USER:-license_auth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-license_auth}?schema=public
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migration:
    image: ghcr.io/zropk66/license-auth-server:migrator
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-license_auth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-license_auth}?schema=public
    # 全新库直接 deploy 即可。老库由历史 db push 建立、没有迁移记录，
    # init 会因表已存在而失败，此时补记基线后再 deploy，避免重建已有数据
    command: ["sh", "-c", "npx prisma migrate deploy || { npx prisma migrate resolve --applied 20261026000000_init && npx prisma migrate deploy; }"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-license_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-license_auth}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-license_auth} -d $${POSTGRES_DB:-license_auth}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
